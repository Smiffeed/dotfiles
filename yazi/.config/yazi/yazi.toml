[opener]
edit = [
	{ run = 'nvim "$@"', block = true, desc = "nvim" },
]
brave = [
	{ run = 'brave-origin "$@"', orphan = true, desc = "Open in Brave" }
]

[open]
prepend_rules = [
	{ url = "*.{md,markdown,txt}", use = [ "edit", "reveal" ] },
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	{ mime = "application/{json,ndjson,yaml,x-yaml,toml,xml,javascript,x-sh,sql}", use = [ "edit", "reveal" ] },
	{ mime = "application/pdf", use = [ "open", "brave" ] },
	{ url = "*.html", use = [ "open", "edit" ] }
]
